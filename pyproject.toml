[project]
name = "documind"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Shivtej Ghorpade", email = "is23bm033@iitdh.ac.in" }
]
requires-python = ">=3.11"
dependencies = [
    "docling>=2.126.0",
    "faiss-cpu>=1.15.0",
    "langchain-mistralai>=1.1.6",
    "langchain-openrouter>=0.2.8",
    "openai>=3.13.0",
    "pymupdf>=1.28.2",
    "sentence-transformers>=6.0.1",
]

[project.scripts]
documind = "documind:main"

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"
